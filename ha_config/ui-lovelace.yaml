# ==============================================================================
# SMART HOME COMMAND & MONITORING CENTER (Lovelace YAML Mode)
# Giao diện giám sát, điều khiển, chỉnh sửa tham số hoạt động trực quan
# ==============================================================================
title: "Smart Home Command Center"
views:
  # ----------------------------------------------------------------------------
  # VIEW 1: TỔNG QUAN / OVERVIEW (KIOSK VIEW)
  # ----------------------------------------------------------------------------
  - title: "Tổng quan"
    path: overview
    icon: mdi:view-dashboard
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
      grid-gap: 12px
    badges: []
    cards:
      # Header Card
      - type: markdown
        title: "🤖 TRỢ LÝ AI SMART HOME"
        content: >
          **Lời chào:** Chào mừng gia đình bạn về nhà! Chế độ nhà: **{{ states('input_select.house_mode') }}**.
          
          🌤 **Thời tiết ngoài trời:** Dự báo quang đãng, mát mẻ &bull; 🌡 **Trong nhà:** {{ states('sensor.bedroom_temperature') }}°C ({{ states('sensor.bedroom_humidity') }}%)
          
          💡 **Gợi ý tự động hóa:** Bạn có thể ra lệnh giọng nói hoặc trò chuyện với Trợ lý AI qua Web Dashboard (`:5000`) và Telegram Bot.

      # Card 1: Khóa cửa & Trạng thái Nhận diện khuôn mặt
      - type: entities
        title: "🚪 Kiểm soát Cửa & Nhận diện Face ID"
        icon: mdi:door-closed-lock
        show_header_toggle: false
        entities:
          - entity: lock.front_door
            name: "Khóa chốt điện Cửa chính"
          - entity: binary_sensor.front_door_contact_sensor
            name: "Cảm biến từ trạng thái cửa"
          - entity: sensor.double_take_latest_person
            name: "Khuôn mặt nhận diện gần nhất"
          - entity: sensor.double_take_match_confidence
            name: "Độ tin cậy nhận diện (%)"
          - entity: input_boolean.face_recognition_auto_unlock
            name: "Tự động mở khi nhận diện đúng"

      # Card 2: Chế độ an ninh & Báo động
      - type: entities
        title: "🛡️ Trạng thái An ninh"
        icon: mdi:security
        show_header_toggle: false
        entities:
          - entity: input_boolean.security_armed_away
            name: "Chế độ Bảo vệ (Armed Away)"
            icon: mdi:shield-lock-outline
          - entity: input_boolean.vacation_mode
            name: "Chế độ Vắng nhà dài ngày"
            icon: mdi:home-export-outline
          - entity: binary_sensor.bedroom_mmwave_presence
            name: "Hiện diện người (LD2410 Radar)"
            icon: mdi:motion-sensor
          - entity: binary_sensor.bedroom_mmwave_motion
            name: "Chuyển động tức thì"
            icon: mdi:run-fast

      # Card 3: Camera giám sát cửa chính (Live Stream)
      - type: picture-entity
        title: "📹 Camera Chuông cửa Cửa chính"
        entity: camera.front_door_ai_camera
        camera_view: live
        show_name: true
        show_state: true
        aspect_ratio: "16:9"

      # Card 4: Điều khiển Rơ-le Đèn & Quạt (Living Room Relays)
      - type: entities
        title: "💡 Thiết bị Phòng Khách"
        icon: mdi:ceiling-light
        show_header_toggle: true
        entities:
          - entity: switch.living_room_main_light
            name: "Đèn chính trần"
          - entity: switch.living_room_ambient_light
            name: "Đèn hắt viền / Ambient"
          - entity: switch.living_room_ceiling_fan
            name: "Quạt trần phòng khách"
          - entity: switch.living_room_aux_socket
            name: "Ổ cắm phụ trợ (Còi báo động)"

      # Card 5: Biểu đồ lịch sử Nhiệt độ & Độ ẩm (DHT22)
      - type: history-graph
        title: "📈 Biểu đồ Môi trường 24 Giờ (DHT22)"
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.bedroom_temperature
            name: "Nhiệt độ (°C)"
          - entity: sensor.bedroom_humidity
            name: "Độ ẩm (%)"

  # ----------------------------------------------------------------------------
  # VIEW 2: CẤU HÌNH & CHỈNH SỬA THAM SỐ HOẠT ĐỘNG (PARAMETER TUNING)
  # ----------------------------------------------------------------------------
  - title: "Chỉnh sửa Cấu hình"
    path: configuration
    icon: mdi:tune-vertical
    cards:
      - type: entities
        title: "⚙️ Tinh chỉnh Tham số Tự động hóa"
        show_header_toggle: false
        entities:
          - entity: input_select.house_mode
            name: "Chế độ hoạt động ngôi nhà"
          - entity: input_number.face_recognition_threshold
            name: "Ngưỡng tin cậy Face ID để mở cửa"
          - entity: input_number.light_auto_off_delay
            name: "Thời gian chờ tắt đèn khi vắng người"
          - entity: input_number.door_unlock_duration
            name: "Thời gian giữ mở chốt khóa cửa"
          - entity: input_number.fan_temp_trigger_high
            name: "Nhiệt độ kích hoạt bật quạt"
          - entity: input_number.fan_temp_trigger_low
            name: "Nhiệt độ tắt quạt khi đã mát"
          - entity: input_number.security_cooldown_seconds
            name: "Giãn cách gửi cảnh báo Telegram"

      - type: entities
        title: "🎛️ Bật / Tắt các Cơ chế Tự động"
        show_header_toggle: false
        entities:
          - entity: input_boolean.face_recognition_auto_unlock
            name: "Mở khóa tự động theo Face ID"
          - entity: input_boolean.auto_lights_enabled
            name: "Tự động bật/tắt đèn theo Radar"
          - entity: input_boolean.auto_fan_enabled
            name: "Tự động bật/tắt quạt theo nhiệt độ"
          - entity: input_boolean.anti_spoofing_check
            name: "Kiểm tra chống giả mạo khuôn mặt"
          - entity: input_boolean.guest_mode
            name: "Chế độ đón tiếp Khách (Guest Mode)"

      - type: entities
        title: "🌐 Cấu hình Địa chỉ Kết nối Ngoại vi"
        show_header_toggle: false
        entities:
          - entity: input_text.esp32_cam_ip
            name: "Địa chỉ IP Camera Chuông cửa"

  # ----------------------------------------------------------------------------
  # VIEW 3: KIỂM SOÁT RA VÀO & FACE ID (ACCESS CONTROL & LOGS)
  # ----------------------------------------------------------------------------
  - title: "Kiểm soát Ra vào"
    path: access-control
    icon: mdi:face-recognition
    cards:
      - type: horizontal-stack
        cards:
          - type: button
            name: "MỞ KHÓA CỬA CHÍNH (5S)"
            icon: mdi:lock-open-variant
            tap_action:
              action: call-service
              service: lock.unlock
              target:
                entity_id: lock.front_door

          - type: button
            name: "KÍCH HOẠT BÁO VỆ (ARM)"
            icon: mdi:shield-lock
            tap_action:
              action: call-service
              service: input_boolean.turn_on
              target:
                entity_id: input_boolean.security_armed_away

      - type: picture-entity
        title: "📷 Trực tiếp Cửa Ra Vào"
        entity: camera.front_door_ai_camera
        camera_view: live
        aspect_ratio: "16:9"

      - type: markdown
        title: "👥 Danh sách Thành viên Gia đình (Supabase & CompreFace)"
        content: >
          Các thành viên đã đăng ký Face ID trong hệ thống:
          
          - 👤 **Chủ hộ (Admin)**: Toàn quyền ra vào cửa chính và tất cả phòng
          - 👤 **Thành viên gia đình**: Quyền ra vào cửa chính và phòng khách
          - 👤 **Khách quen (Guest)**: Mở khóa khi bật Guest Mode

  # ----------------------------------------------------------------------------
  # VIEW 4: CẢM BIẾN MÔI TRƯỜNG & RADAR (CLIMATE & SENSOR VIEW)
  # ----------------------------------------------------------------------------
  - title: "Cảm biến & Radar"
    path: sensors
    icon: mdi:radar
    cards:
      - type: gauge
        entity: sensor.bedroom_temperature
        name: "Nhiệt độ phòng ngủ"
        min: 15
        max: 45
        needle: true
        severity:
          green: 22
          yellow: 28
          red: 34

      - type: gauge
        entity: sensor.bedroom_humidity
        name: "Độ ẩm phòng ngủ"
        min: 20
        max: 100
        needle: true
        severity:
          green: 45
          yellow: 65
          red: 80

      - type: entities
        title: "📡 Chi tiết Radar mmWave HLK-LD2410"
        entities:
          - entity: binary_sensor.bedroom_mmwave_presence
            name: "Trạng thái hiện diện"
          - entity: binary_sensor.bedroom_mmwave_still
            name: "Phát hiện mục tiêu tĩnh (Hơi thở)"
          - entity: sensor.bedroom_moving_target_distance
            name: "Khoảng cách mục tiêu động"
          - entity: sensor.bedroom_still_target_distance
            name: "Khoảng cách mục tiêu tĩnh"
          - entity: sensor.bedroom_moving_target_energy
            name: "Năng lượng chuyển động"
          - entity: sensor.bedroom_still_target_energy
            name: "Năng lượng mục tiêu tĩnh"

  # ----------------------------------------------------------------------------
  # VIEW 5: GIÁM SÁT TRẠNG THÁI THIẾT BỊ & HẠ TẦNG (DEVICE & SYSTEM HEALTH)
  # ----------------------------------------------------------------------------
  - title: "Trạng thái Thiết bị"
    path: system-health
    icon: mdi:server-network
    cards:
      - type: entities
        title: "📶 Kết nối Mạng Các Node Phần Cứng (ESP32)"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.living_room_node_online_status
            name: "Node 1: Rơ-le Phòng khách & Khóa từ"
          - entity: binary_sensor.bedroom_sensor_node_online_status
            name: "Node 2: Cảm biến DHT22 & Radar mmWave"
          - entity: binary_sensor.doorbell_camera_online_status
            name: "Node 3: Camera Chuông cửa AI"

      - type: markdown
        title: "🐳 Cụm Dịch vụ Máy chủ (Docker Services)"
        content: >
          - 🏠 **Home Assistant Core**: `http://localhost:8123`
          - 📡 **Mosquitto MQTT Broker**: `tcp://localhost:1883`
          - 🧠 **CompreFace AI Admin**: `http://localhost:8000`
          - 🎯 **Double-Take Hub**: `http://localhost:3000`
          - ⚡ **ESPHome Dashboard**: `http://localhost:6052`
          - 🔀 **Node-RED Automation**: `http://localhost:1880`
          - ☁️ **Supabase Cloud DB**: PostgreSQL & Storage
