# Eclipse Mosquitto MQTT Broker Configuration
# Local-first Smart Home Network

# Default listener on port 1883 (IPv4 and IPv6)
listener 1883 0.0.0.0

# WebSocket listener (useful for web dashboards / Node-RED)
listener 9001 0.0.0.0
protocol websockets

# Allow anonymous connections for local intranet testing
# (Recommended: set to false and configure password_file in production)
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
