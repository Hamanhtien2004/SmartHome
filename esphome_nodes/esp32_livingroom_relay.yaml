substitutions:
  node_name: esp32-livingroom-relay
  friendly_name: "Living Room & Door Lock Controller"
  mqtt_broker_ip: "192.168.1.100" # Thay bang IP cua Host chay Mosquitto Docker

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  comment: "ESP32 4-Channel Relay Node + Magnetic Door Lock & Door Contact Sensor"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Native Home Assistant API (Khuyen nghi de tu dong dong bo thuc the vao HA)
api:
  encryption:
    key: "ReplaceWithYourGenerated32ByteBase64Key="

# Over-The-Air firmware updates
ota:
  platform: esphome
  password: "admin_ota_password"

# Wi-Fi Configuration
wifi:
  ssid: "Your_WiFi_SSID"
  password: "Your_WiFi_Password"
  fast_connect: true
  power_save_mode: none # Giu ket noi lien tuc, giam do tre phan hoi

  ap:
    ssid: "LivingRoom-Relay-Fallback"
    password: "fallbackpassword123"

captive_portal:

logger:
  level: INFO
  baud_rate: 115200

# Giao dien Web cuc bo (Standalone Web UI de cuu ho khi mat Home Assistant)
web_server:
  port: 80

# ==============================================================================
# MQTT COEXISTENCE (Dong bo MQTT cung luc voi HA Native API tranh xung dot)
# Cho phep Node-RED, Python Bot, va cac he thong khac doc/ghi truc tiep
# ==============================================================================
mqtt:
  broker: ${mqtt_broker_ip}
  port: 1883
  topic_prefix: "esphome/livingroom_relay"
  discovery: true # Tu dong phat hien tren Home Assistant
  birth_message:
    topic: "esphome/livingroom_relay/status"
    payload: "online"
  will_message:
    topic: "esphome/livingroom_relay/status"
    payload: "offline"

# Built-in Blue LED for status indication
status_led:
  pin:
    number: GPIO2
    inverted: false

# ==============================================================================
# RELAY OUTPUTS (Lights, Fan & Access Control Lock)
# Che do Active LOW, co chong mat dong bo trang thai sau khi mat dien
# ==============================================================================
switch:
  - platform: gpio
    name: "Living Room Main Light"
    id: relay_1
    pin:
      number: GPIO16
      inverted: true
    icon: "mdi:lightbulb"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Living Room Ambient Light"
    id: relay_2
    pin:
      number: GPIO17
      inverted: true
    icon: "mdi:wall-sconce-flat"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Living Room Ceiling Fan"
    id: relay_3
    pin:
      number: GPIO18
      inverted: true
    icon: "mdi:fan"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Living Room Aux Socket"
    id: relay_4
    pin:
      number: GPIO19
      inverted: true
    icon: "mdi:power-socket-eu"
    restore_mode: RESTORE_DEFAULT_OFF

  # Electronic Door Strike / Drop-bolt Lock Relay (GPIO23)
  # Xung kich mo 5 giay, chong ket relay va tu dong ngat an toan
  - platform: gpio
    name: "Front Door Lock Electronic Relay"
    id: front_door_lock_relay
    pin:
      number: GPIO23
      inverted: true
    icon: "mdi:door-closed-lock"
    restore_mode: ALWAYS_OFF # Tuyet doi khong mo khoa khi vua khoi dong lai
    on_turn_on:
      - delay: 5s
      - switch.turn_off: front_door_lock_relay

  - platform: restart
    name: "Living Room Controller Restart"

# ==============================================================================
# PHYSICAL WALL SWITCHES & MAGNETIC DOOR SENSORS
# Xu ly nut bam vat ly ngay tai Edge (phan cung ESP32) giup he thong van hoat dong
# 100% binh thuong ngay ca khi Router Wi-Fi bi tat hoac may chu bao tri
# ==============================================================================
binary_sensor:
  - platform: gpio
    name: "Wall Switch 1"
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms # Chong nhieu va rung phim co
    on_press:
      then:
        - switch.toggle: relay_1

  - platform: gpio
    name: "Wall Switch 2"
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: relay_2

  - platform: gpio
    name: "Wall Switch 3"
    pin:
      number: GPIO25
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: relay_3

  - platform: gpio
    name: "Wall Switch 4"
    pin:
      number: GPIO26
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: relay_4

  # Cảm biến má từ phát hiện cửa đóng/mở (Reed switch)
  - platform: gpio
    name: "Front Door Contact Sensor"
    id: front_door_contact
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true # Open = OFF, Closed = ON
    device_class: door
    filters:
      - delayed_on_off: 100ms # Chong nhieu rung khi dong cua manh

  - platform: status
    name: "Living Room Controller Status"

sensor:
  - platform: wifi_signal
    name: "Living Room WiFi Signal RSSI"
    update_interval: 60s
  - platform: uptime
    name: "Living Room Controller Uptime"
