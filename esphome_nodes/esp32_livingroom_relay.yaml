substitutions:
  node_name: esp32-livingroom-relay
  friendly_name: "Living Room & Door Lock Controller"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  comment: "ESP32 4-Channel Relay Node + Magnetic Door Lock & Door Contact Sensor"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable native Home Assistant API
api:
  encryption:
    key: "ReplaceWithYourGenerated32ByteBase64Key="

# Over-The-Air firmware updates
ota:
  platform: esphome
  password: "admin_ota_password"

# Wi-Fi Configuration
wifi:
  ssid: "Your_WiFi_SSID"
  password: "Your_WiFi_Password"

  # Fallback AP when WiFi network is unavailable
  ap:
    ssid: "LivingRoom-Relay-Fallback"
    password: "fallbackpassword123"

captive_portal:

logger:
  level: INFO

# Local Web Server for emergency standalone control
web_server:
  port: 80

# Built-in Blue LED for status indication
status_led:
  pin:
    number: GPIO2
    inverted: false

# ==============================================================================
# RELAY OUTPUTS (Lights, Fan & Access Control Lock)
# ==============================================================================
switch:
  - platform: gpio
    name: "Living Room Main Light"
    id: relay_1
    pin:
      number: GPIO16
      inverted: true
    icon: "mdi:lightbulb"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Living Room Ambient Light"
    id: relay_2
    pin:
      number: GPIO17
      inverted: true
    icon: "mdi:wall-sconce-flat"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Living Room Ceiling Fan"
    id: relay_3
    pin:
      number: GPIO18
      inverted: true
    icon: "mdi:fan"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Living Room Aux Socket"
    id: relay_4
    pin:
      number: GPIO19
      inverted: true
    icon: "mdi:power-socket-eu"
    restore_mode: RESTORE_DEFAULT_OFF

  # Electronic Door Strike / Drop-bolt Lock Relay (GPIO23)
  - platform: gpio
    name: "Front Door Lock Electronic Relay"
    id: front_door_lock_relay
    pin:
      number: GPIO23
      inverted: true
    icon: "mdi:door-closed-lock"
    # Auto re-lock after 5 seconds pulse for safety
    on_turn_on:
      - delay: 5s
      - switch.turn_off: front_door_lock_relay

  - platform: restart
    name: "Living Room Controller Restart"

# ==============================================================================
# PHYSICAL WALL SWITCHES & MAGNETIC DOOR SENSORS
# ==============================================================================
binary_sensor:
  - platform: gpio
    name: "Wall Switch 1"
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: relay_1

  - platform: gpio
    name: "Wall Switch 2"
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: relay_2

  - platform: gpio
    name: "Wall Switch 3"
    pin:
      number: GPIO25
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: relay_3

  - platform: gpio
    name: "Wall Switch 4"
    pin:
      number: GPIO26
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - switch.toggle: relay_4

  # Magnetic Reed Contact Sensor for Door Status (Open / Closed)
  - platform: gpio
    name: "Front Door Contact Sensor"
    id: front_door_contact
    pin:
      number: GPIO27
      mode:
        input: true
        pullup: true
      inverted: true # Open = OFF, Closed = ON
    device_class: door
    filters:
      - delayed_on_off: 100ms

  # Node Status & Connection
  - platform: status
    name: "Living Room Controller Status"

sensor:
  - platform: wifi_signal
    name: "Living Room WiFi Signal RSSI"
    update_interval: 60s
  - platform: uptime
    name: "Living Room Controller Uptime"
